server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy so session cookies are first-party.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media uploads go through here. Nginx would refuse a large recording at 1 MB
        # with its own 413, before the backend ever gets to apply its per-kind ceilings
        # (MAX_VIDEO_UPLOAD_MB), so the front door has to stand at least as wide as the
        # back one. The ceiling stays the backend's to enforce.
        client_max_body_size 1024m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
